<svg xmlns="http://www.w3.org/2000/svg" width="602" height="2212" viewBox="0 0 602 2212" role="img" aria-label="npm test — 로직 검증 · 체인 없음 실행 결과">
  <rect width="602" height="2212" rx="12" fill="#17141D"/>
  <rect width="602" height="34" rx="12" fill="#241F2E"/>
  <rect y="22" width="602" height="12" fill="#241F2E"/>
  <circle cx="20" cy="17" r="5" fill="#DD6B5A"/>
  <circle cx="38" cy="17" r="5" fill="#D99245"/>
  <circle cx="56" cy="17" r="5" fill="#3FAE73"/>
  <g font-family="D2Coding, 'JetBrains Mono', Consolas, 'SFMono-Regular', 'Noto Sans KR', monospace" font-size="12">
    <text x="76" y="21" fill="#8E8478">npm test — 로직 검증 · 체인 없음</text>
  </g>
  <g font-family="D2Coding, 'JetBrains Mono', Consolas, 'SFMono-Regular', 'Noto Sans KR', monospace" font-size="13.5" xml:space="preserve">
  <text x="22.0" y="52" fill="#C79A3F" font-weight="600">흥정 밴드 — 값은 모델이 제안하고 하한선은 코드가 강제한다</text>
  <text x="38.3" y="73" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="73" fill="#EDE7DA">정가 이상이면 모델을 부르지 않고 수락 구간</text>
  <text x="38.3" y="94" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="94" fill="#EDE7DA">하한선 미만이면 모델을 부르지 않고 거절 구간</text>
  <text x="38.3" y="115" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="115" fill="#EDE7DA">하한선 정확히 위는 흥정 구간 (경계 포함)</text>
  <text x="38.3" y="136" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="136" fill="#EDE7DA">정가 1 wei 아래는 흥정 구간 (경계)</text>
  <text x="38.3" y="157" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="157" fill="#EDE7DA">하한선 계산이 bigint로 유지된다 (부동소수 누수 없음)</text>
  <text x="22.0" y="178" fill="#B4A99A"></text>
  <text x="22.0" y="199" fill="#C79A3F" font-weight="600">최종 관문 — 어떤 경로로 온 결정이든 하한선을 넘을 수 없다</text>
  <text x="38.3" y="220" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="220" fill="#EDE7DA">모델이 헐값 수락을 반환해도 차단된다</text>
  <text x="38.3" y="241" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="241" fill="#EDE7DA">모델이 0원 수락을 반환해도 차단된다</text>
  <text x="38.3" y="262" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="262" fill="#EDE7DA">정당한 수락은 통과한다</text>
  <text x="38.3" y="283" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="283" fill="#EDE7DA">거절은 언제나 그대로 거절이다</text>
  <text x="22.0" y="304" fill="#B4A99A"></text>
  <text x="22.0" y="325" fill="#C79A3F" font-weight="600">결정론 판단 — 모델이 없을 때의 규칙</text>
  <text x="38.3" y="346" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="346" fill="#EDE7DA">하한선과 정가의 중간을 넘으면 수락</text>
  <text x="38.3" y="367" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="367" fill="#EDE7DA">중간 미만이면 거절</text>
  <text x="38.3" y="388" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="388" fill="#EDE7DA">모든 상인의 하한선에서 결정론 판단이 하한선을 넘지 않는다</text>
  <text x="22.0" y="409" fill="#B4A99A"></text>
  <text x="22.0" y="430" fill="#C79A3F" font-weight="600">주민 데이터 — data/npcs.json</text>
  <text x="38.3" y="451" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="451" fill="#EDE7DA">모든 주민에 필수 필드가 있다</text>
  <text x="38.3" y="472" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="472" fill="#EDE7DA">id가 중복되지 않는다</text>
  <text x="38.3" y="493" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="493" fill="#EDE7DA">주소가 유효한 형식이고 중복되지 않는다</text>
  <text x="38.3" y="514" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="514" fill="#EDE7DA">상인은 floorRatio와 stall을 가진다</text>
  <text x="38.3" y="535" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="535" fill="#EDE7DA">주민이 마을 반경(55) 안에 산다</text>
  <text x="38.3" y="556" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="556" fill="#EDE7DA">walletIndex가 .botwallets.json 주소와 일치한다 (있을 때만)</text>
  <text x="22.0" y="577" fill="#B4A99A"></text>
  <text x="22.0" y="598" fill="#C79A3F" font-weight="600">주야 사이클 — 밤에도 읽을 수 있어야 한다</text>
  <text x="38.3" y="619" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="619" fill="#EDE7DA">키프레임을 읽어냈다</text>
  <text x="38.3" y="640" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="640" fill="#EDE7DA">주변광이 어느 시각에도 0.3 아래로 내려가지 않는다</text>
  <text x="38.3" y="661" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="661" fill="#EDE7DA">햇빛(달빛)이 어느 시각에도 0.3 아래로 내려가지 않는다</text>
  <text x="38.3" y="682" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="682" fill="#EDE7DA">한낮이 한밤보다 확실히 밝다</text>
  <text x="38.3" y="703" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="703" fill="#EDE7DA">한밤에 등불이 켜지고 한낮에 꺼진다</text>
  <text x="38.3" y="724" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="724" fill="#EDE7DA">쇼케이스는 한낮으로 고정된다 (데모 영상 보호)</text>
  <text x="22.0" y="745" fill="#B4A99A"></text>
  <text x="22.0" y="766" fill="#C79A3F" font-weight="600">던전 문 확률 — 컨트랙트·서버·코어가 같은 표를 본다</text>
  <text x="22.0" y="787" fill="#B4A99A">     돌 218/218 · 바람 141/192 · 도깨비 64/154</text>
  <text x="38.3" y="808" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="808" fill="#EDE7DA">세 구현의 경계값이 같다</text>
  <text x="22.0" y="829" fill="#B4A99A">     손익분기 돌 5.74 · 바람 3.80 · 도깨비 2.39층</text>
  <text x="38.3" y="850" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="850" fill="#EDE7DA">세 문 모두 귀환/전진 손익분기가 있고 위험·보너스가 서로 다르다</text>
  <text x="22.0" y="871" fill="#B4A99A"></text>
  <text x="22.0" y="892" fill="#C79A3F" font-weight="600">풍류 — 상태가 트랙을 정하고, 임계는 화면과 하나다</text>
  <text x="38.3" y="913" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="913" fill="#EDE7DA">도깨비 곁에서는 트랙이 바뀐다</text><text x="279.9" y="913" fill="#8E8478"> — 빨라지고 북이 붙는다</text>
  <text x="22.0" y="934" fill="#B4A99A">     스텝 0.34s → 0.22s</text>
  <text x="38.3" y="955" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="955" fill="#EDE7DA">깎을수록 빨라진다 (진행도가 템포를 올린다)</text>
  <text x="38.3" y="976" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="976" fill="#EDE7DA">심장박동은 이름표가 붉어지는 바로 그 순간에 켜진다</text>
  <text x="38.3" y="997" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="997" fill="#EDE7DA">그리는 쪽(Village.tsx)이 같은 임계 함수를 쓴다</text>
  <text x="22.0" y="1018" fill="#B4A99A"></text>
  <text x="22.0" y="1039" fill="#C79A3F" font-weight="600">효과음 — 마을이 삑삑거리지 않게 하는 규율</text>
  <text x="22.0" y="1060" fill="#B4A99A">     타격 최소 간격 70ms</text>
  <text x="38.3" y="1081" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1081" fill="#EDE7DA">타격 레이트 리밋이 45~70ms 안에 있다 (연타가 기관총이 되지 않게)</text>
  <text x="38.3" y="1102" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1102" fill="#EDE7DA">효과음이 오디오 컨텍스트를 새로 열지 않는다</text>
  <text x="22.0" y="1123" fill="#B4A99A">     낱개 9개 + 묶음 2종 확인</text>
  <text x="38.3" y="1144" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1144" fill="#EDE7DA">반입한 소리가 가리키는 파일이 실제로 있다</text>
  <text x="38.3" y="1165" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1165" fill="#EDE7DA">자동으로 나가는 전송(프레즌스 비컨)은 소리를 내지 않는다</text>
  <text x="22.0" y="1186" fill="#B4A99A"></text>
  <text x="22.0" y="1207" fill="#C79A3F" font-weight="600">에셋 원장 — 출처 없는 바이너리는 들어올 수 없다</text>
  <text x="38.3" y="1228" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1228" fill="#EDE7DA">client/src에는 여전히 바이너리를 두지 않는다 (에셋은 public 아래)</text>
  <text x="38.3" y="1249" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1249" fill="#EDE7DA">public의 모든 에셋이 원장에 적힌 자리 안에 있다</text>
  <text x="22.0" y="1270" fill="#B4A99A">     6건 · CC0-1.0 · CC-BY-4.0 · OFL-1.1</text>
  <text x="38.3" y="1291" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1291" fill="#EDE7DA">라이선스가 허용 목록(CC0·CC-BY·OFL) 안에 있다</text>
  <text x="38.3" y="1312" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1312" fill="#EDE7DA">표기가 필요한 라이선스는 저작자 이름이 있다</text>
  <text x="22.0" y="1333" fill="#B4A99A">     4,042KB / 20,480KB</text>
  <text x="38.3" y="1354" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1354" fill="#EDE7DA">용량이 예산 안에 있다</text>
  <text x="38.3" y="1375" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1375" fill="#EDE7DA">사람이 읽는 원장(ASSETS.md)이 최신이다</text>
  <text x="22.0" y="1396" fill="#B4A99A"></text>
  <text x="22.0" y="1417" fill="#C79A3F" font-weight="600">HUD — .hud는 pointer-events:none 이라 버튼마다 되살려야 한다</text>
  <text x="22.0" y="1438" fill="#B4A99A">     검사한 버튼 클래스: hud-btn, hud-sound</text>
  <text x="38.3" y="1459" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1459" fill="#EDE7DA">HUD의 &lt;button&gt;에 붙은 클래스가 pointer-events:auto 를 가진다</text>
  <text x="22.0" y="1480" fill="#B4A99A"></text>
  <text x="22.0" y="1501" fill="#C79A3F" font-weight="600">재미 루프 — 무료 소셜 행동과 매일 하나의 선택</text>
  <text x="38.3" y="1522" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1522" fill="#EDE7DA">이모트 5종이 서버/체인 비컨과 같은 아이콘 표를 쓴다</text>
  <text x="38.3" y="1543" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1543" fill="#EDE7DA">무료 첫걸음 뒤 장사꾼·원정대·장인의 길을 고른다</text>
  <text x="38.3" y="1564" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1564" fill="#EDE7DA">오늘의 부탁은 KST 날짜를 쓰고 세 무료 행동 중 하나다</text>
  <text x="22.0" y="1585" fill="#B4A99A"></text>
  <text x="22.0" y="1606" fill="#C79A3F" font-weight="600">마을 충돌 — 로컬에서만, 배치표 한 곳에서</text>
  <text x="38.3" y="1627" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1627" fill="#EDE7DA">한옥 안으로 걸어 들어가지 못한다</text>
  <text x="38.3" y="1648" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1648" fill="#EDE7DA">분수 안에 들어가지 못한다</text>
  <text x="38.3" y="1669" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1669" fill="#EDE7DA">벽에 비스듬히 부딪히면 미끄러진다 (제자리에 붙지 않는다)</text>
  <text x="38.3" y="1690" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1690" fill="#EDE7DA">상호작용 지점은 막지 않는다</text><text x="264.9" y="1690" fill="#8E8478"> — 모닥불·도깨비·포털에 닿는다</text>
  <text x="38.3" y="1711" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1711" fill="#EDE7DA">첫 등장 자리(0, 5)와 광장이 비어 있다</text>
  <text x="38.3" y="1732" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1732" fill="#EDE7DA">마을 밖으로 나가지 못한다</text>
  <text x="38.3" y="1753" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1753" fill="#EDE7DA">노점은 열려 있을 때만 막는다 (닫히면 유령 벽이 남지 않는다)</text>
  <text x="22.0" y="1774" fill="#B4A99A">     콜라이더 38개 (한옥 6채 포함)</text>
  <text x="38.3" y="1795" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1795" fill="#EDE7DA">그리는 쪽(Village.tsx)이 같은 배치표를 읽는다</text>
  <text x="22.0" y="1816" fill="#B4A99A"></text>
  <text x="22.0" y="1837" fill="#C79A3F" font-weight="600">주민 산책 — 벽을 비비지도, 한 틱에 튀지도 않는다</text>
  <text x="22.0" y="1858" fill="#B4A99A">     집이 노점·건물과 겹치는 주민 4/6명 — 세울 때 밖으로</text>
  <text x="38.3" y="1879" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1879" fill="#EDE7DA">상인은 자기 좌판 안에 서 있다</text><text x="281.2" y="1879" fill="#8E8478"> — 그래서 세울 때 한 번 밖으로 내보낸다</text>
  <text x="38.3" y="1900" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1900" fill="#EDE7DA">목적지는 갈 수 있는 자리만 고른다</text>
  <text x="22.0" y="1921" fill="#B4A99A">     1분에 23~29m 걷고, 최대 보폭 0.120m</text>
  <text x="38.3" y="1942" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="1942" fill="#EDE7DA">1분을 걸어도 한 틱에 한 걸음보다 더 가지 않는다 (튀지 않는다)</text>
  <text x="22.0" y="1963" fill="#B4A99A"></text>
  <text x="22.0" y="1984" fill="#C79A3F" font-weight="600">공개 프로토콜 — 남이 만든 클라이언트도 같은 마을에 선다</text>
  <text x="38.3" y="2005" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="2005" fill="#EDE7DA">world.json이 지금 배치표와 일치한다 (굽는 것을 잊으면 여기서 걸린다)</text>
  <text x="22.0" y="2026" fill="#B4A99A">     막힌 지점 2118개 · 최대 오차 0.418mm</text>
  <text x="38.3" y="2047" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="2047" fill="#EDE7DA">world.json만 읽고 걸어도 같은 벽에 막힌다</text>
  <text x="22.0" y="2068" fill="#B4A99A">     메시지 24종 전부 문서에 있음</text>
  <text x="38.3" y="2089" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="2089" fill="#EDE7DA">PROTOCOL.md가 서버의 메시지를 하나도 빠뜨리지 않는다</text>
  <text x="38.3" y="2110" fill="#3FAE73" font-weight="700">✅</text><text x="59.5" y="2110" fill="#EDE7DA">문서가 가리키는 상수가 실제 서버 값과 같다</text>
  <text x="22.0" y="2131" fill="#B4A99A"></text>
  <text x="22.0" y="2152" fill="#392F44">──────────────────────────────────────────────────</text>
  <text x="22.0" y="2173" fill="#3FAE73" font-weight="700">전부 통과 (59건) · 가스 0</text>
  </g>
</svg>
